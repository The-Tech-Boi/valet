<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --win: #f9f9f9; --win-2: #f3f3f3; --fg: #1b1b1b; --muted: #5f6368; --line: #e1e1e1;
    --accent: #005fb8; --accent-fg: #ffffff; --btn: #fdfdfd; --btn-line: #d1d1d1; --deny: #c42b1c; --ok: #0f7b0f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --win: #2b2b2b; --win-2: #202020; --fg: #f3f3f3; --muted: #b4b7bb; --line: #3a3a3a;
      --accent: #4cc2ff; --accent-fg: #00121c; --btn: #373737; --btn-line: #454545; --deny: #ff99a4; --ok: #6ccb5f;
    }
    button:hover { filter: brightness(1.12); }
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--accent-fg); }
  html { overflow: hidden; }
  body { margin: 0; background: var(--win); color: var(--fg); user-select: none; cursor: default;
         font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .body { padding: 8px 24px 20px; }
  .foot { background: var(--win-2); border-top: 1px solid var(--line); padding: 16px 24px;
          display: flex; gap: 8px; justify-content: flex-end; }
  button { font: inherit; min-width: 96px; padding: 6px 14px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--btn-line); background: var(--btn); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:hover { filter: brightness(.97); }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .q { font: 600 20px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  label { display: block; color: var(--muted); margin: 14px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input { font: inherit; width: 100%; padding: 5px 10px; border-radius: 4px; color: var(--fg); background: var(--btn);
          border: 1px solid var(--btn-line); border-bottom-color: var(--muted); outline: none; user-select: text; }
  input:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  input[aria-invalid="true"] { border-bottom: 2px solid var(--deny); padding-bottom: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .hint:empty { display: none; }
  .hint.ok { color: var(--ok); }
  .hint.bad { color: var(--deny); }
  .err { color: var(--deny); margin: 12px 0 0; overflow-wrap: anywhere; }
  .err:empty { display: none; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="body" role="dialog" aria-labelledby="q" aria-describedby="sub">
    <p class="q" id="q">Connect valet to your vault</p>
    <p class="sub" id="sub">Use your personal API key: web vault &rsaquo; Account settings &rsaquo; Security &rsaquo; Keys &rsaquo; View API key.</p>
    <label for="server">Vault URL</label>
    <input id="server" type="url" spellcheck="false" placeholder="https://vault.example.com">
    <label for="id">client_id</label>
    <input id="id" spellcheck="false" placeholder="user.…" aria-describedby="id-hint">
    <p class="hint bad" id="id-hint"></p>
    <label for="secret">client_secret</label>
    <input id="secret" type="password" spellcheck="false" aria-describedby="secret-hint err">
    <p class="hint" id="secret-hint" aria-live="polite"></p>
    <p class="err" id="err" role="alert"></p>
  </div>
  <div class="foot">
    <button class="primary" id="go" disabled>Sign in</button>
    <button type="button" id="cancel">Cancel</button>
  </div>
</form>
<script>
  const d = window.valet, $ = id => document.getElementById(id);
  const server = $("server"), id = $("id"), secret = $("secret");
  let done = false;
  const answer = a => { if (!done) { done = true; ipc.postMessage(a); secret.value = ""; } };
  server.value = d.server || "";
  id.value = d.client_id || "";
  $("err").textContent = d.error || "";

  function check() {
    const i = id.value.trim(), s = secret.value.trim().length;
    const idBad = i.startsWith("organization.")
      ? "This is an organization key. valet needs your personal key (starts with user.)."
      : i && !"user.".startsWith(i.slice(0, 5)) ? "A personal client_id starts with user." : "";
    $("id-hint").textContent = idBad;
    id.setAttribute("aria-invalid", idBad ? "true" : "false");
    const h = $("secret-hint");
    h.textContent = s ? `${s} characters pasted` : "Hidden. Paste with Ctrl+V or right-click.";
    h.className = s ? "hint ok" : "hint";
    $("go").disabled = !(/^https?:\/\/\S+$/.test(server.value.trim()) && i.startsWith("user.") && s);
    ipc.postMessage("size:" + document.documentElement.offsetHeight);
  }
  for (const el of [server, id, secret]) el.oninput = check;
  check();

  $("f").onsubmit = e => {
    e.preventDefault();
    if (!$("go").disabled) answer(["ok:" + server.value.trim(), id.value.trim(), secret.value.trim()].join("\n"));
  };
  $("cancel").onclick = () => answer("cancel");
  addEventListener("keydown", e => { if (e.key === "Escape") answer("cancel"); });
  addEventListener("contextmenu", e => { if (e.target.tagName !== "INPUT") e.preventDefault(); }); // inputs keep Paste
  (server.value ? (id.value ? secret : id) : server).focus();
</script>
</body>
</html>
