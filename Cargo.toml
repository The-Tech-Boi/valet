[package]
name = "valet"
version = "0.2.0"
edition = "2021"
description = "Use credentials from a Vaultwarden/Bitwarden vault without revealing them"
license = "MIT"
repository = "https://github.com/The-Tech-Boi/valet"

# Add a dependency only if a few lines of code cannot replace it.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs"] }
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
chrono = "0.4"
url = "2"
base64 = "0.22"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
regex = "1"
aes = "0.9.4"
cbc = "0.2.1"
hkdf = "0.13.0"
pbkdf2 = "0.13.0"
argon2 = "0.6.0"
rsa = "0.10.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "winauth", "native-tls", "chrono"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
wry = "0.57.3"
tao = "0.37.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
